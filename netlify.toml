[build]
  command = "npm run build:netlify"
  publish = "dist2"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Gemini image edits can take a while (paid plans allow up to 26s)
[functions."image-edit"]
  timeout = 26

# Proxy API → serverless functions
[[redirects]]
  from = "/api/image/edit"
  to = "/.netlify/functions/image-edit"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
